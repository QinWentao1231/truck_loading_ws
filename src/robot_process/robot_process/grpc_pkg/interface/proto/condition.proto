syntax = "proto3";

// 运单输入条件总包。
message Condition{
    CarCondition car = 1; // 车辆尺寸与安全余量
    repeated OrderCondition orders = 2; // 子订单及其箱型信息
    Limitation limit = 3; // 规划器垛型限制
}

// 车辆参数，尺寸单位由接口双方约定；robot_process 当前按毫米处理。
message CarCondition{
    string type = 1; // 车型代号
    Size original = 2; // 车辆内部原始尺寸
    Size reserve = 3; // 安全运行预留尺寸
    Size frame = 4; // 尾门门框尺寸
    Size head = 5; // 车头前端尺寸
}

// 长、宽、高三维尺寸。
message Size{
    float L = 1; // 长度/车厢深度方向
    float W = 2; // 宽度/车厢宽度方向
    float H = 3; // 高度/车厢高度方向
}

// 一个子订单及其可用箱型。
message OrderCondition{
    string orderId = 1; // 子订单号
    repeated BoxCondition boxes = 2; // 该子订单的箱型配置
}

// 箱型尺寸、抓取能力及业务标识。
message BoxCondition{
    string type = 1; // 箱型代号
    Size original = 2; // 箱体原始尺寸
    Size reserve = 3; // 箱体建模附加余量
    Grip grip = 4; // P1/P2/P3单抓能力
    int32 Nt = 5; // 该箱型总箱数
    string contractId = 6; // 合同号
    string materialId = 7; // 物料代号
}

// 各区域允许的单抓箱数列表。
message Grip{
    repeated int32 P1 = 1; // P1竖放抓取参数
    repeated int32 P2 = 2; // P2侧壁区抓取参数
    repeated int32 P3 = 3; // P3侧立抓取参数
}

// 规划器生成垛型时使用的限制条件。
message Limitation{
    int32 N1min = 1; // 每行P1个数下限
    int32 T3max = 2; // P3高度行数上限
    int32 N2max = 3; // 每行P2个数上限
    int32 T12min = 4; // P1P2高度行数下限
    repeated int32 Elim = 5; // 允许的尾料形态
    bool Istrapezoid = 6; // 是否允许梯形尾垛
    int32 Strategy = 7; // 垛型生成策略偏重
    int32 P1P2gap = 8; // P1/P2箱间隙（暂定）
    int32 G = 9; // 重心裕量（暂定）
    int32 Tback = 10; // 每面之间的纵深余量
    repeated int32 Overlap = 11; // 堆叠缝隙尺寸
}
