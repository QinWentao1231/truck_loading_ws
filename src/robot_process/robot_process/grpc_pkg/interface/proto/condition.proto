syntax = "proto3";

// 订单条件总包
message Condition{
    CarCondition car = 1; // 车辆条件
    repeated OrderCondition orders = 2; // 子订单条件
    Limitation limit = 3; // 订单限制
}

// 车辆条件
message CarCondition{
    string type = 1; // 车型代号
    Size original = 2; // 车辆原始尺寸
    Size reserve = 3; // 安全运行冗余尺寸
    Size frame = 4; // 尾门门框尺寸
}

// 尺寸参数
message Size{
    float L = 1; // 长度
    float W = 2; // 宽度
    float H = 3; // 高度
}

// 子订单条件
message OrderCondition{
    string orderId = 1; // 子订单号
    repeated BoxCondition boxes = 2; // 箱型信息
}

// 箱型信息
message BoxCondition{
    string type = 1; // 箱型代号
    Size original = 2; // 箱型原始尺寸
    Size reserve = 3; // 箱型冗余尺寸
    Grip grip = 4; // 抓取参数
    int32 Nt = 5; // 总个数
}

// 抓取参数(单抓个数和单次抓取时间)
message Grip{
    repeated int32 P1 = 1; // P1抓取参数
    repeated int32 P2 = 2; // P2抓取参数
    repeated int32 P3 = 3; // P3抓取参数
}

// 订单限制
message Limitation{
    int32 N1min = 1; // 每行P1个数下限
    int32 T3max = 2; // P3高度行数上限
    int32 N2max = 3; // 每行P2个数上限
    int32 T12min = 4; // P1P2高度行数下限
    repeated int32 Elim = 5; // 尾料形态可选限制
    bool Istrapezoid = 6; // 梯形尾垛开关
    int32 Strategy = 7; // 垛型生成策略偏重
    int32 P1P2gap = 8; // P1P2箱间隙(暂定)
    int32 G = 9; // 重心裕量(暂定)
    int32 Tback = 10; // 垛型每面间隙冗余
    repeated int32 Overlap = 11; // 堆叠缝隙尺寸
}